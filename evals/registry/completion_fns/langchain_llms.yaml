  args:
    llm: OpenAI
    llm_kwargs:
      model_name: gpt-3.5-turbo

langchain/llm/text-davinci-003:
  class: evals.completion_fns.langchain_llm:LangChainLLMCompletionFn
  args:
    llm: OpenAI
    llm_kwargs:
      model_name: text-davinci-003

langchain/llm/flan-t5-xl:
  class: evals.completion_fns.langchain_llm:LangChainLLMCompletionFn
  args:
    llm: HuggingFaceHub
    llm_kwargs:
      repo_id: google/flan-t5-xl

langchain/chat_model/gpt-3.5-turbo:
  class: evals.completion_fns.langchain_llm:LangChainChatModelCompletionFn
  args:
    llm: ChatOpenAI
    llm_kwargs:
      model_name: gpt-3.5-turbo

langchain/chat_model/openai:
  class: evals.completion_fns.langchain_llm:LangChainAnyChatModelCompletionFn
  args:
    llm: gpt-4o
    chat_model_kwargs:
      model_provider: openai
      temperature: 0.7

langchain/chat_model/anthropic:
  class: evals.completion_fns.langchain_llm:LangChainAnyChatModelCompletionFn
  args:
    llm: claude-3-5-sonnet-20240620
    chat_model_kwargs:
      model_provider: anthropic
      temperature: 0.7

langchain/chat_model/google_vertexai:
  class: evals.completion_fns.langchain_llm:LangChainAnyChatModelCompletionFn
  args:
    llm: gemini-1.5-flash
    chat_model_kwargs:
      model_provider: google_vertexai
      temperature: 0.7


langchain/chat_model/groq:
  class: evals.completion_fns.langchain_llm:LangChainAnyChatModelCompletionFn
  args:
    llm: mixtral-8x7b-32768
    chat_model_kwargs:
      model_provider: groq
      temperature: 0.7


llama/3-8b:
  class: evals.completion_fns.llama:LlamaCompletionFn
  args:
    llm: meta-llama/Meta-Llama-3-8B-Instruct
    llm_kwargs:
      load_in_8bit: true
      load_in_4bit: false
      use_fast_kernels: false
      gen_kwargs:
        max_new_tokens: 200
        do_sample: true
        top_p: 1.0
        temperature: 1.0
        min_length: null
        use_cache: false
        top_k: 50
        repetition_penalty: 1.0
        length_penalty: 1

llama/3-70b:
  class: evals.completion_fns.llama:LlamaCompletionFn
  args:
    llm: meta-llama/Meta-Llama-3-70B-Instruct
    llm_kwargs:
      load_in_8bit: false
      load_in_4bit: true
      use_fast_kernels: false
      gen_kwargs:
        max_new_tokens: 200
        do_sample: true
        top_p: 1.0
        temperature: 1.0
        min_length: null
        use_cache: false
        top_k: 50
        repetition_penalty: 1.0
        length_penalty: 1